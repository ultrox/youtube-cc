name: Setup
description: Install pnpm, Node (from .nvmrc) and dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
      with:
        cache: true
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
    - run: pnpm install --frozen-lockfile
      shell: bash
