<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture - YouTube</title>
    <style>
      body { margin: 0; background: #0f0f0f; font-family: Roboto, Arial, sans-serif; }
      #movie_player { position: relative; width: 960px; height: 540px; margin: 20px; background: #222; overflow: hidden; }
      .ytp-chrome-bottom { position: absolute; left: 12px; right: 12px; bottom: 0; height: 48px; }
      .ytp-right-controls { position: absolute; right: 0; top: 0; height: 48px; display: flex; }
      .ytp-button { width: 48px; height: 48px; border: 0; background: none; color: #fff; padding: 0; }
    </style>
  </head>
  <body>
    <div id="movie_player" class="html5-video-player">
      <div class="ytp-chrome-bottom">
        <div class="ytp-right-controls">
          <button type="button" class="ytp-subtitles-button ytp-button" aria-pressed="false" aria-keyshortcuts="c">CC</button>
          <button type="button" class="ytp-button ytp-settings-button" aria-expanded="false">⚙</button>
          <button type="button" class="ytp-fullscreen-button ytp-button">⛶</button>
        </div>
      </div>
    </div>
    <script>
      // A stand-in for YouTube's player caption API (src/bridge/page.ts lists what the real one does).
      const scenario = new URLSearchParams(location.search).get('v') || 'many';
      const t = (languageCode, kind = '', name = languageCode) => ({
        languageCode,
        languageName: name,
        displayName: kind === 'asr' ? `${name} (auto-generated)` : name,
        kind,
        vss_id: `${kind === 'asr' ? 'a' : ''}.${languageCode}`,
        is_translateable: true,
      });
      const TRACKS = {
        many: [t('de', '', 'German'), t('en', '', 'English'), t('en', 'asr', 'English'), t('fr', '', 'French')],
        dub: [t('en', 'asr', 'English')],
        'dub-original': [t('en', 'asr', 'English')],
        asr: [t('en', 'asr', 'English')],
        none: [],
      }[scenario];
      const LANGS = ['de', 'en', 'bs', 'hr', 'sr', 'fr', 'es', 'iw'].map((languageCode) => ({
        languageCode,
        languageName: languageCode,
      }));

      const player = document.getElementById('movie_player');
      const cc = player.querySelector('.ytp-subtitles-button');
      let current = null;
      window.calls = [];
      window.playerClicks = 0;
      window.shortcutKeys = [];

      const show = (track) => {
        current = track;
        cc.setAttribute('aria-pressed', String(!!track));
      };
      player.getVideoData = () => ({ video_id: scenario });
      player.getOption = (module, option) => {
        if (module !== 'captions') return undefined;
        if (option === 'tracklist') return TRACKS.map((x) => ({ ...x }));
        if (option === 'translationLanguages') return TRACKS.length ? LANGS : [];
        if (option === 'track') return current ? { ...current } : {};
      };
      player.setOption = (module, option, value) => {
        window.calls.push({ vss: value.vss_id, to: value.translationLanguage?.languageCode ?? null });
        show(value);
      };
      cc.addEventListener('click', () => show(current ? null : TRACKS[0] ?? null));

      // Audio tracks, as the real player builds them: "251;" + base64url(xtags: acont, lang), plus
      // details under a minified key. "dub": English original, YouTube starts the German dub.
      const xtags = (tags) => {
        const bytes = [];
        for (const [k, v] of Object.entries(tags)) {
          const kb = [...new TextEncoder().encode(k)];
          const vb = [...new TextEncoder().encode(v)];
          const pair = [0x0a, kb.length, ...kb, 0x12, vb.length, ...vb];
          bytes.push(0x0a, pair.length, ...pair);
        }
        return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      };
      const audio = (lang, original) => ({
        id: `251;${xtags({ acont: original ? 'original' : 'dubbed', lang })}`,
        Xb: { id: `${lang}.${original ? 4 : 3}`, name: original ? `${lang} original` : lang },
      });
      // "dub-original": dubs exist, but the original plays; the player then reports a placeholder.
      const AUDIO = scenario.startsWith('dub') ? [audio('de', false), audio('en', true), audio('fr', false)] : [];
      let currentAudio = scenario === 'dub' ? AUDIO[0] : { id: '251', Xb: { id: 'und', name: 'Default' } };
      window.audioCalls = [];
      player.getAvailableAudioTracks = () => AUDIO;
      player.getAudioTrack = () => currentAudio;
      player.setAudioTrack = (track) => {
        window.audioCalls.push(track.Xb.id);
        currentAudio = track;
        return true;
      };
      window.audioNow = () => currentAudio.Xb.id;
      player.addEventListener('click', () => window.playerClicks++);
      // YouTube's shortcuts listen on the document.
      document.addEventListener('keydown', (e) => window.shortcutKeys.push(e.key));
    </script>
  </body>
</html>
